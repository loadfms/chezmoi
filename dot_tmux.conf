
# enable true color
set-option -ga terminal-overrides ',*:Tc'
# set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",ghostty:RGB"
# set -ag terminal-overrides ",xterm-kitty:RGB"

#set-option -a terminal-features 'screen-256color:RGB'
set-option -sg escape-time 10
set-option -g focus-events on

# Claude Code / TUI apps: notificacoes de desktop, Shift+Enter e scroll com a roda no fullscreen
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on

# 0 is too far from ` ;)
set -g base-index 1

# defaults herdados do tmux-sensible (sem TPM)
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -wg aggressive-resize on
bind R source-file ~/.tmux.conf \; display "tmux.conf recarregado"
bind C-p previous-window
bind C-n next-window

# Theme
source-file ~/.tmux-themes/main.tmux

# Set vi keys
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# split panes using | and -
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %

# Use Alt-vim keys without prefix key to switch panes
bind -n S-Left select-pane -L
bind -n S-Down select-pane -D
bind -n S-Up select-pane -U
bind -n S-Right select-pane -R

# Resize panes with prefix + Shift+Arrow (repeatable)
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"

# abre o scrollback do pane atual no nvim (prefix + e)
bind e run-shell 'tmux capture-pane -p -S -10000 > /tmp/tmux-pane-#{pane_id}.txt; tmux neww "nvim /tmp/tmux-pane-#{pane_id}.txt"'

# only show status bar if more than one window exists
if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"
set-hook -g window-linked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
set-hook -g window-unlinked 'if -F "#{==:#{session_windows},1}" "set -g status off" "set -g status on"'
